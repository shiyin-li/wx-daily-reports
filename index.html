<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>微信群日报演示</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18231f;
      --muted: #64716b;
      --line: #dbe5dc;
      --paper: #fbfaf5;
      --panel: #ffffff;
      --accent: #b95f2b;
      --accent-soft: #f5e7dc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #eef4ec 0%, var(--paper) 48%, #eef2f6 100%);
      color: var(--ink);
    }
    main {
      width: min(1040px, calc(100vw - 48px));
      margin: 0 auto;
      padding: 72px 0 88px;
    }
    .eyebrow {
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }
    h1 {
      margin: 12px 0 12px;
      font-size: clamp(42px, 8vw, 88px);
      line-height: .96;
      letter-spacing: 0;
    }
    .lead {
      width: min(720px, 100%);
      margin: 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.8;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin: 44px 0 28px;
    }
    .metric {
      padding: 22px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .68);
      border-radius: 8px;
    }
    .metric strong {
      display: block;
      font-size: 32px;
      line-height: 1;
    }
    .metric span {
      display: block;
      margin-top: 10px;
      color: var(--muted);
      font-size: 14px;
    }
    .grid {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }
    .report-card {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 16px;
      padding: 20px 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: inherit;
      text-decoration: none;
      box-shadow: 0 18px 50px rgba(36, 48, 40, .06);
    }
    .report-card:hover {
      border-color: #c9d7cd;
      transform: translateY(-1px);
    }
    .slug {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 18px;
      font-weight: 800;
    }
    .day {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .arrow {
      padding: 8px 11px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }
    @media (max-width: 720px) {
      main { width: min(100vw - 28px, 1040px); padding-top: 36px; }
      .summary { grid-template-columns: 1fr; }
      .report-card { grid-template-columns: 1fr; align-items: start; }
      .slug { white-space: normal; }
      h1 { font-size: 46px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Wechat Daily Archive</div>
    <h1>微信群日报演示</h1>
    <p class="lead">这是对外演示页，只展示日报产品形态。真实群名、成员昵称、聊天原文、链接、头像和敏感统计都已隐藏。</p>
    <section class="summary">
      <div class="metric"><strong>10</strong><span>演示群组</span></div>
      <div class="metric"><strong>08:30</strong><span>每天自动运行</span></div>
      <div class="metric"><strong>0</strong><span>公开聊天原文</span></div>
    </section>
    <section class="grid">
<a class="report-card" href="reports/group-5/2026-05-02/index.html"><span class="slug">五群</span><span class="day">2026-05-02</span><span class="arrow">open</span></a>
<a class="report-card" href="reports/group-5/2026-05-01/index.html"><span class="slug">五群</span><span class="day">2026-05-01</span><span class="arrow">open</span></a>
<a class="report-card" href="reports/group-4/2026-05-02/index.html"><span class="slug">四群</span><span class="day">2026-05-02</span><span class="arrow">open</span></a>
<a class="report-card" href="reports/group-4/2026-05-01/index.html"><span class="slug">四群</span><span class="day">2026-05-01</span><span class="arrow">open</span></a>
<a class="report-card" href="reports/group-3/2026-05-02/index.html"><span class="slug">三群</span><span class="day">2026-05-02</span><span class="arrow">open</span></a>
<a class="report-card" href="reports/group-3/2026-05-01/index.html"><span class="slug">三群</span><span class="day">2026-05-01</span><span class="arrow">open</span></a>
<a class="report-card" href="reports/group-2/2026-05-02/index.html"><span class="slug">二群</span><span class="day">2026-05-02</span><span class="arrow">open</span></a>
<a class="report-card" href="reports/group-2/2026-05-01/index.html"><span class="slug">二群</span><span class="day">2026-05-01</span><span class="arrow">open</span></a>
<a class="report-card" href="reports/group-1/2026-05-02/index.html"><span class="slug">一群</span><span class="day">2026-05-02</span><span class="arrow">open</span></a>
<a class="report-card" href="reports/group-1/2026-05-01/index.html"><span class="slug">一群</span><span class="day">2026-05-01</span><span class="arrow">open</span></a>
    </section>
  </main>
</body>
</html>
