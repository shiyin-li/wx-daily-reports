interface:
  display_name: "WeChat Daily Report"
  short_description: "Use wx-cli to fetch WeChat history and generate an interactive daily report HTML/PNG"
  default_prompt: "Generate a WeChat group daily report with this workflow: 1) use jackwener/wx-cli through scripts/wx_cli_to_report.py to produce stats.json and simplified_chat.txt, or use --binary when a local wechat-cli package is provided, 2) read references/ai_prompt.md plus the chat text and generate valid ai_content.json, 3) render report.html, 4) render report.png with the desktop daily-report viewport. Do not skip the AI content step, and do not promise Obsidian can directly read WeChat without an export/import pipeline."
